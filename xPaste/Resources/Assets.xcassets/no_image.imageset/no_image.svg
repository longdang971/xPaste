<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120">
  <!-- Background -->
  <rect width="160" height="120" fill="#F0F0F2" rx="0"/>

  <!-- Photo frame -->
  <rect x="32" y="22" width="96" height="76" rx="8" ry="8"
        fill="none" stroke="#C0C0C6" stroke-width="2.5"/>

  <!-- Sky gradient (simulated with rect) -->
  <rect x="34.25" y="24.25" width="91.5" height="71.5" rx="6" ry="6" fill="#E8E8EC"/>

  <!-- Sun circle -->
  <circle cx="55" cy="40" r="9" fill="#D0D0D8"/>

  <!-- Mountain far (lighter) -->
  <polygon points="58,86 90,46 122,86" fill="#C8C8D0"/>

  <!-- Mountain near (darker) -->
  <polygon points="34,86 66,54 98,86" fill="#B8B8C2"/>

  <!-- Bottom ground strip -->
  <rect x="34.25" y="84" width="91.5" height="12" rx="0" ry="0" fill="#B0B0BA"/>
  <!-- Clip ground corners -->
  <rect x="34.25" y="84" width="91.5" height="6" fill="#B8B8C2"/>

  <!-- Diagonal slash -->
  <line x1="26" y1="106" x2="134" y2="14"
        stroke="#888896" stroke-width="4" stroke-linecap="round"/>

  <!-- No-image text -->
  <text x="80" y="112" font-family="-apple-system, Helvetica Neue, sans-serif"
        font-size="11" font-weight="500" fill="#A0A0AA"
        text-anchor="middle">No Preview</text>
</svg>
